<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto & Fiat Converter</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #131b2e;
      --panel-border: #1e2d4a;
      --accent-binance: #f0b90b;
      --accent-bcv: #00f2fe;
      --accent-intervencion: #a855f7;
      --text-primary: #f1f5f9;
      --text-secondary: #64748b;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-card {
      width: 100%;
      max-width: 460px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    /* Top Ticker */
    .ticker-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .ticker-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--panel-border);
      padding: 10px 8px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.3s ease;
    }

    .ticker-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .ticker-item.usdt { border-top: 3px solid var(--accent-binance); }
    .ticker-item.bcv { border-top: 3px solid var(--accent-bcv); }
    .ticker-item.intervencion { border-top: 3px solid var(--accent-intervencion); }

    .ticker-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .ticker-val {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .ticker-val.loading {
      color: var(--text-secondary);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Sync Header */
    .sync-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
      padding: 0 4px;
    }

    .btn-refresh {
      background: none;
      border: none;
      color: var(--accent-bcv);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .btn-refresh:hover {
      background: rgba(0, 242, 254, 0.1);
    }

    .btn-refresh:active {
      transform: scale(0.95);
    }

    /* Convert Blocks */
    .convert-block {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      transition: all 0.3s ease;
    }

    .convert-block:hover {
      border-color: rgba(255, 255, 255, 0.1);
    }

    .block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .block-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .swap-btn {
      background: var(--panel-border);
      color: var(--text-primary);
      border: none;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .swap-btn:hover {
      background: var(--text-secondary);
      transform: translateY(-1px);
    }

    .swap-btn:active {
      transform: scale(0.95);
    }

    .input-box {
      position: relative;
      margin-bottom: 10px;
    }

    .input-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--panel-border);
      padding: 10px 12px;
      padding-right: 60px;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: all 0.3s;
    }

    .input-box input:focus {
      border-color: var(--text-secondary);
      box-shadow: 0 0 0 2px rgba(100, 116, 139, 0.2);
    }

    .input-box input::placeholder {
      color: var(--text-secondary);
      font-weight: 400;
    }

    .input-box .badge {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .out-box {
      background: var(--bg);
      border: 1px dashed var(--panel-border);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }

    .out-box:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .out-val {
      font-size: 1rem;
      font-weight: 700;
      color: var(--success);
      word-break: break-all;
    }

    .btn-copy {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }

    /* Manual Override Drawer */
    details {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 10px;
    }

    summary {
      cursor: pointer;
      user-select: none;
      margin-bottom: 8px;
      transition: all 0.3s;
    }

    summary:hover {
      color: var(--text-primary);
    }

    .override-form {
      display: flex;
      gap: 8px;
    }

    .override-form input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px;
      color: #fff;
      transition: all 0.3s;
    }

    .override-form input:focus {
      border-color: var(--text-secondary);
      outline: none;
    }

    .override-form button {
      background: var(--panel-border);
      color: #fff;
      border: none;
      padding: 0 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .override-form button:hover {
      background: var(--text-secondary);
    }

    .error-message {
      color: var(--danger);
      font-size: 0.7rem;
      margin-top: 4px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    @media (max-width: 380px) {
      .app-card {
        padding: 16px;
      }
      
      .ticker-bar {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      
      .ticker-item {
        flex-direction: row;
        justify-content: space-between;
        padding: 8px 12px;
      }

      .ticker-item.usdt { border-top: none; border-left: 3px solid var(--accent-binance); }
      .ticker-item.bcv { border-top: none; border-left: 3px solid var(--accent-bcv); }
      .ticker-item.intervencion { border-top: none; border-left: 3px solid var(--accent-intervencion); }
    }
  </style>
</head>
<body>

  <div class="app-card">
    
    <!-- Ticker de Tasas Actuales -->
    <div class="ticker-bar">
      <div class="ticker-item usdt">
        <span class="ticker-title">USDT (P2P)</span>
        <span class="ticker-val loading" id="ticker-usdt">--</span>
      </div>
      <div class="ticker-item bcv">
        <span class="ticker-title">Oficial BCV</span>
        <span class="ticker-val loading" id="ticker-bcv">--</span>
      </div>
      <div class="ticker-item intervencion">
        <span class="ticker-title">Intervención</span>
        <span class="ticker-val loading" id="ticker-intervencion">--</span>
      </div>
    </div>

    <!-- Barra de Estado -->
    <div class="sync-status">
      <span id="sync-time">Cargando datos...</span>
      <button class="btn-refresh" onclick="syncRates()">🔄 Sincronizar</button>
    </div>

    <!-- Conversor USDT -->
    <div class="convert-block">
      <div class="block-header">
        <span class="block-title">Mercado USDT</span>
        <button class="swap-btn" id="swap-usdt-btn" onclick="toggleDirection('usdt')">USDT ➔ BS</button>
      </div>
      <div class="input-box">
        <input type="number" id="in-usdt" placeholder="0.00" oninput="calculate('usdt')" step="any">
        <span class="badge" id="badge-usdt">USDT</span>
      </div>
      <div class="out-box">
        <span class="out-val" id="out-usdt">0.00 Bs</span>
        <button class="btn-copy" onclick="copyValue('out-usdt')" title="Copiar resultado">📋</button>
      </div>
    </div>

    <!-- Conversor BCV Oficial -->
    <div class="convert-block">
      <div class="block-header">
        <span class="block-title">Oficial (BCV)</span>
        <button class="swap-btn" id="swap-bcv-btn" onclick="toggleDirection('bcv')">USD ➔ BS</button>
      </div>
      <div class="input-box">
        <input type="number" id="in-bcv" placeholder="0.00" oninput="calculate('bcv')" step="any">
        <span class="badge" id="badge-bcv">USD</span>
      </div>
      <div class="out-box">
        <span class="out-val" id="out-bcv">0.00 Bs</span>
        <button class="btn-copy" onclick="copyValue('out-bcv')" title="Copiar resultado">📋</button>
      </div>
    </div>

    <!-- Conversor Intervención Bancaria -->
    <div class="convert-block">
      <div class="block-header">
        <span class="block-title">Intervención Bancaria (+0.5%)</span>
        <button class="swap-btn" id="swap-intervencion-btn" onclick="toggleDirection('intervencion')">USD ➔ BS</button>
      </div>
      <div class="input-box">
        <input type="number" id="in-intervencion" placeholder="0.00" oninput="calculate('intervencion')" step="any">
        <span class="badge" id="badge-intervencion">USD</span>
      </div>
      <div class="out-box">
        <span class="out-val" id="out-intervencion">0.00 Bs</span>
        <button class="btn-copy" onclick="copyValue('out-intervencion')" title="Copiar resultado">📋</button>
      </div>
    </div>

    <!-- Calculadora Meta en Bs (USDT Requeridos) -->
    <div class="convert-block">
      <div class="block-header">
        <span class="block-title">Meta en Bolívares ➔ USDT</span>
      </div>
      <div class="input-box">
        <input type="number" id="in-target" placeholder="Monto en Bs necesarios" oninput="calculateTarget()" step="any">
        <span class="badge">VES</span>
      </div>
      <div class="out-box">
        <span class="out-val" id="out-target">0.00 USDT</span>
        <button class="btn-copy" onclick="copyValue('out-target')" title="Copiar resultado">📋</button>
      </div>
    </div>

    <!-- Ajuste Manual de Emergencia -->
    <details id="details-manual">
      <summary>⚙️ Ajustar tasa USDT manualmente</summary>
      <div class="override-form">
        <input type="number" id="custom-usdt" placeholder="Ej: 45.50" step="0.01">
        <button onclick="applyCustomUsdt()">Fijar</button>
      </div>
      <div id="error-message" class="error-message">Por favor ingrese un valor válido</div>
    </details>

  </div>

  <script>
    let rates = { usdt: 0, bcv: 0, intervencion: 0 };
    let directions = { usdt: 'direct', bcv: 'direct', intervencion: 'direct' };

    async function syncRates() {
  const syncTime = document.getElementById('sync-time');
  const usdtTicker = document.getElementById('ticker-usdt');
  const bcvTicker = document.getElementById('ticker-bcv');
  const intervencionTicker = document.getElementById('ticker-intervencion');

  syncTime.textContent = '🔄 Sincronizando...';
  [usdtTicker, bcvTicker, intervencionTicker].forEach(el => {
    el.textContent = '...';
    el.className = 'ticker-val loading';
  });

  let errors = [];

  // 1. OBTENER BCV OFICIAL
  try {
    const resBcv = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
    const dataBcv = await resBcv.json();
    if (dataBcv && dataBcv.promedio) {
      rates.bcv = dataBcv.promedio;
      rates.intervencion = rates.bcv * 1.005;
      bcvTicker.textContent = `${rates.bcv.toFixed(2)} Bs`;
      bcvTicker.className = 'ticker-val';
      intervencionTicker.textContent = `${rates.intervencion.toFixed(2)} Bs`;
      intervencionTicker.className = 'ticker-val';
    } else {
      errors.push('BCV');
    }
  } catch (e) {
    console.error("Error BCV:", e);
    errors.push('BCV');
  }

  // 2. OBTENER USDT DIRECTO DE TU API SERVERLESS
  try {
    // Agregamos el timestamp ?_t= para romper la caché del navegador
    const resUsdt = await fetch(`/api/get-usdt?_t=${Date.now()}`);
    
    if (!resUsdt.ok) throw new Error(`HTTP Error ${resUsdt.status}`);
    
    const dataUsdt = await resUsdt.json();

    if (dataUsdt && dataUsdt.price) {
      rates.usdt = parseFloat(dataUsdt.price);
      usdtTicker.textContent = `${rates.usdt.toFixed(2)} Bs`;
      usdtTicker.className = 'ticker-val';
    } else {
      throw new Error("Respuesta de API inválida");
    }
  } catch (e) {
    console.error("Error obteniendo USDT desde /api/get-usdt:", e);
    errors.push('USDT');
  }

  // ESTADO FINAL DE LA BARRA
  if (errors.length === 2) {
    syncTime.textContent = '⚠️ Error de conexión';
  } else if (errors.length > 0) {
    syncTime.textContent = `⚠️ Falló: ${errors.join(', ')}`;
  } else {
    const now = new Date();
    const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    syncTime.textContent = `✅ Actualizado • ${time}`;
  }

  recalculateAll();
}

    function calculate(type) {
      const inputVal = parseFloat(document.getElementById(`in-${type}`).value);
      const rate = rates[type];
      const outEl = document.getElementById(`out-${type}`);

      if (isNaN(inputVal) || !rate || rate <= 0) { 
        outEl.textContent = type === 'usdt' && directions[type] === 'reverse' ? '0.00 USDT' : '0.00 Bs';
        return; 
      }

      if (directions[type] === 'direct') {
        const total = inputVal * rate;
        outEl.textContent = `${total.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Bs`;
      } else {
        const total = inputVal / rate;
        const symbol = type === 'usdt' ? 'USDT' : '$';
        outEl.textContent = `${symbol} ${total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      }
    }

    function calculateTarget() {
      const targetBs = parseFloat(document.getElementById('in-target').value);
      const outEl = document.getElementById('out-target');

      if (isNaN(targetBs) || !rates.usdt || rates.usdt <= 0) { 
        outEl.textContent = '0.00 USDT';
        return; 
      }

      const usdtNeeded = targetBs / rates.usdt;
      outEl.textContent = `${usdtNeeded.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USDT`;
    }

    function recalculateAll() {
      calculate('usdt');
      calculate('bcv');
      calculate('intervencion');
      calculateTarget();
    }

    function copyValue(elementId) {
      const element = document.getElementById(elementId);
      const text = element.textContent.trim();
      
      if (text.startsWith('0.00') || text === '--') return;
      
      navigator.clipboard.writeText(text).then(() => {
        const btn = element.parentElement.querySelector('.btn-copy');
        const originalText = btn.textContent;
        btn.textContent = '✅';
        setTimeout(() => {
          btn.textContent = originalText;
        }, 1500);
      }).catch(e => console.error('Error al copiar:', e));
    }

    document.addEventListener('DOMContentLoaded', () => {
      syncRates();
      setInterval(syncRates, 60000);
    });
  </script>
</body>
</html>
